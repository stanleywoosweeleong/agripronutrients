  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />

  <!-- Precompiled Tailwind CSS — self-hosted, works offline -->
  <link rel="stylesheet" href="vendor/app.css" />

  <!-- Bare-minimum splash styling, inlined so the splash still looks right
       even if vendor/app.css fails to load (the diagnostic screen needs this). -->
  <style>
    html, body { height: 100%; margin: 0; background: #fafaf9; }
    #pwa-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem;
      background: linear-gradient(180deg, #1c4c2f 0%, #0f301e 100%);
      color: #f0fadc;
      font-family: system-ui, -apple-system, sans-serif;
      transition: opacity .35s ease;
    }
    #pwa-splash.hidden { opacity: 0; pointer-events: none; }
    #pwa-splash > svg { width: 96px; height: 96px; animation: pwa-pulse 1.6s ease-in-out infinite; }
    #pwa-splash .label { font-weight: 700; letter-spacing: .15em; opacity: .9; }
    /* Top bar: the share button is icon-only (and the language button drops
       its icon on phones) where space is tight, so the app title stays readable. */
    @media (max-width: 479px), (min-width: 768px) and (max-width: 1023px) { .share-label { display: none; } }
    @media (max-width: 479px) { .lang-icon { display: none !important; } }
    /* Modal sheets: stay clear of the notch / home bar, and centre with auto
       margins so a sheet taller than the screen scrolls instead of being cut off. */
    .sheet-overlay {
      position: fixed; inset: 0; z-index: 100; display: flex;
      overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
      padding: calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
               calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    }
    .sheet-overlay > .sheet-card { margin: auto; }
    /* pH chart: on phones show whole-number ticks only so they don't collide. */
    @media (max-width: 479px) { .ph-half-tick { display: none; } }
    /* Tank-mix screen on phones: drop the outer frame and slim the nested
       cards so the text gets most of the screen width. Desktop is unchanged. */
    @media (max-width: 767px) {
      .mix-panel { padding: 0 !important; border: 0 !important; background: transparent !important; box-shadow: none !important; }
      .mix-panel > :not([hidden]) ~ :not([hidden]) { margin-top: 1.5rem !important; }
      .mix-panel .mix-section { padding: 1rem !important; border-width: 1px !important; border-radius: 1.25rem !important; }
      .mix-panel .mix-section-body { padding: 1rem !important; }
      .mix-panel .mix-section > .absolute { display: none; }
      .mix-panel .mix-head { flex-direction: row !important; align-items: center !important; margin-bottom: 1rem !important; }
      .mix-panel .mix-card { padding: .875rem !important; border-width: 1px !important; border-radius: 1rem !important; }
      .mix-panel .mix-card-frame { border-width: 1px !important; border-radius: 1rem !important; }
      .mix-panel .mix-card-row { padding: .875rem !important; gap: .75rem !important; }
      .mix-panel .mix-row { flex-direction: row !important; align-items: flex-start !important; gap: .75rem !important; }
      .mix-panel .mix-icon { padding: .5rem !important; border-radius: .75rem !important; }
      .mix-panel .mix-icon svg { width: 20px; height: 20px; }
      .mix-panel .text-2xl { font-size: 1.25rem !important; line-height: 1.6rem !important; }
      .mix-panel .text-xl { font-size: 1.0625rem !important; line-height: 1.55 !important; }
      .mix-panel .tracking-widest, .mix-panel .tracking-\[0\.2em\] { letter-spacing: .05em !important; }
      .mix-panel .mb-8 { margin-bottom: 1rem !important; }
      .mix-panel .space-y-6 > :not([hidden]) ~ :not([hidden]) { margin-top: 1rem !important; }
      .mix-panel .gap-6 { gap: 1rem !important; }
    }
    @media (min-width: 768px) {
      .nav-brand { flex-shrink: 0; }
      /* Centre the tabs with auto margins (not justify-content) so an
         overflowing row still scrolls from its first tab instead of clipping it. */
      .nav-tabs { margin-left: 0; margin-right: 0; min-width: 0; justify-content: flex-start; }
      .nav-tabs > :first-child { margin-left: auto; }
      .nav-tabs > :last-child { margin-right: auto; }
    }
    @keyframes pwa-pulse {
      0%, 100% { transform: scale(1);    opacity: .85; }
      50%      { transform: scale(1.06); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Splash screen: shown until React fires the `agripro:mounted` event -->
  <div class="pwa-splash" id="pwa-splash" aria-hidden="true">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 12 C72 18 86 38 86 60 C86 78 72 88 50 88 C28 88 14 78 14 60 C14 38 28 18 50 12 Z"
            fill="#f0fadc" />
      <path d="M50 12 L50 88" stroke="#78aa5a" stroke-width="3" stroke-linecap="round"/>
      <path d="M50 35 L65 30 M50 50 L70 45 M50 65 L65 62"
            stroke="#78aa5a" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div class="label">AgriPro</div>
    <noscript>
      <div style="margin-top:1.5rem;max-width:280px;text-align:center;font-size:.9rem;opacity:.9;">
        本应用需要启用 JavaScript 才能运行。<br>
        This app requires JavaScript to run.<br>
        Aplikasi ini memerlukan JavaScript untuk berfungsi.
      </div>
    </noscript>
  </div>

  <!--
    Self-hosted vendor bundles. Order matters:
      1. react.production.min.js          -> defines window.React
      2. react-dom.production.min.js      -> defines window.ReactDOM  (depends on React)
      3. tiny shim aliases window.react = React  (lucide UMD looks for lowercase)
      4. lucide-react.min.js              -> defines window.LucideReact
      5. qrcode-generator.js              -> defines window.qrcode (share sheet QR, MIT)
      6. app.js                           -> reads React, ReactDOM, LucideReact, mounts the app
    All marked `defer` so they execute in source order *after* HTML parse but before DOMContentLoaded.
  -->
  <script defer src="vendor/react.production.min.js"></script>
  <script defer src="vendor/react-dom.production.min.js"></script>
  <script defer src="vendor/lucide-bridge.js"></script>
  <script defer src="vendor/lucide-react.min.js"></script>
  <script defer src="vendor/qrcode-generator.js"></script>
  <script defer src="app.js"></script>

  <!-- Splash + service worker plumbing.
       Inline so there is exactly one network round-trip needed before paint. -->
  <script>
    // 1. Splash + diagnostic plumbing.
    //    The splash hides once React fires `agripro:mounted`. If anything fails
    //    before that, we surface the *actual* error directly — not a vague "timeout".
    (function () {
      var splash = document.getElementById('pwa-splash');
      var fatalShown = false;
      var failedAssets = [];

      function hide() {
        if (!splash) return;
        splash.classList.add('hidden');
        setTimeout(function () { splash.remove(); }, 400);
      }

      function showFatal(title, detail) {
        if (fatalShown || !splash) return;
        fatalShown = true;
        splash.style.cssText =
          'position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;' +
          'justify-content:center;gap:1rem;background:linear-gradient(180deg,#1c4c2f,#0f301e);' +
          'color:#f0fadc;font-family:system-ui,sans-serif;z-index:9999;padding:1.5rem;';
        var detailHtml = detail ? detail.replace(/&/g,'&amp;').replace(/</g,'&lt;') : '';
        splash.innerHTML =
          '<div style="max-width:520px;text-align:center;">' +
            '<div style="font-size:1.15rem;font-weight:700;margin-bottom:.6rem;">' + title + '</div>' +
            '<div style="opacity:.9;font-size:.9rem;line-height:1.55;white-space:pre-wrap;text-align:left;' +
                  'background:rgba(0,0,0,.25);padding:.85rem 1rem;border-radius:.6rem;' +
                  'font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;">' +
              detailHtml +
            '</div>' +
            '<div style="opacity:.75;font-size:.85rem;margin-top:1.1rem;">' +
              'Refresh the page, or verify that all files are in the correct folders.' +
            '</div>' +
          '</div>';
      }

      // Catch every asset load failure (404, MIME mismatch, etc.) in the capture phase
      window.addEventListener('error', function (e) {
        var el = e.target;
        if (el && el !== window && (el.src || el.href)) {
          var url = el.src || el.href;
          failedAssets.push(url);
          showFatal(
            'Asset failed to load',
            'Missing or unreachable file(s):\n  ' + failedAssets.join('\n  ') +
            '\n\nMost likely cause: the vendor/ subfolder was not preserved' +
            '\nwhen the files were downloaded or copied. Check that you have:' +
            '\n  • index.html, app.js, sw.js in the root' +
            '\n  • vendor/app.css' +
            '\n  • vendor/react.production.min.js' +
            '\n  • vendor/react-dom.production.min.js' +
            '\n  • vendor/lucide-bridge.js' +
            '\n  • vendor/lucide-react.min.js' +
            '\n  • vendor/qrcode-generator.js'
          );
          return;
        }
        var root = document.getElementById('root');
        if (root && root.firstChild) return;
        showFatal('Script error', (e.message || 'unknown') +
                  (e.filename ? '\n  at ' + e.filename + ':' + (e.lineno || '?') : ''));
      }, true);

      window.addEventListener('agripro:mounted', function () {
        clearTimeout(safety);
        hide();
      }, { once: true });

      var safety = setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.firstChild) { hide(); return; }
        var details = [];
        if (typeof window.React === 'undefined') details.push('window.React is undefined');
        if (typeof window.ReactDOM === 'undefined') details.push('window.ReactDOM is undefined');
        if (typeof window.LucideReact === 'undefined') details.push('window.LucideReact is undefined');
        if (!details.length) details.push('All globals are present but React did not mount.');
        showFatal('Initialization timeout',
                  details.join('\n') +
                  '\n\nCheck the browser DevTools Console for the underlying error.');
      }, 8000);
    })();

    // 2. Service worker registration.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
          reg.addEventListener('updatefound', function () {
            var sw = reg.installing;
            if (!sw) return;
            sw.addEventListener('statechange', function () {
              if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                sw.postMessage('SKIP_WAITING');
              }
            });
          });
        }).catch(function (err) {
          console.warn('SW registration failed:', err);
        });

        var refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      });
    }
  </script>
</body>
</html>
