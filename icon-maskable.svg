<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#235c39"/>
      <stop offset="1" stop-color="#0f301e"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#338050"/>
      <stop offset="1" stop-color="#1c4c2f"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdf3"/>
      <stop offset="1" stop-color="#e6efce"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#322d29"/>
      <stop offset="1" stop-color="#100f0e"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Full-bleed background: no rounded corners, the OS mask handles the shape -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Artwork scaled to ~78% and centred, so it survives any mask shape -->
  <g transform="translate(256 256) scale(0.74) translate(-256 -256)">
    <g transform="rotate(-9 256 260)" filter="url(#soft)">
      <rect x="152" y="140" width="226" height="262" rx="20" fill="#c9d6ad"/>
      <rect x="148" y="132" width="226" height="262" rx="20" fill="url(#page)"/>
      <rect x="132" y="116" width="226" height="262" rx="22" fill="url(#cover)"/>
      <g stroke="#f0fadc" stroke-width="9" stroke-linecap="round" fill="none">
        <path d="M150 146 q-27 8 -8 27"/>
        <path d="M150 194 q-27 8 -8 27"/>
        <path d="M150 242 q-27 8 -8 27"/>
        <path d="M150 290 q-27 8 -8 27"/>
        <path d="M150 338 q-27 8 -8 27"/>
      </g>
      <g transform="translate(252 222)">
        <path d="M0 -56 C 36 -42, 48 -6, 22 32 C 8 52, -8 52, -22 32 C -48 -6, -36 -42, 0 -56 Z" fill="#f0fadc"/>
        <path d="M-2 42 C -2 10, -2 -20, 2 -52" stroke="#338050" stroke-width="7" stroke-linecap="round" fill="none"/>
        <path d="M0 -22 C 10 -26, 18 -30, 22 -38 M0 4 C 12 0, 22 -4, 26 -12 M0 26 C 9 24, 16 22, 20 16" stroke="#338050" stroke-width="5" stroke-linecap="round" fill="none"/>
        <path d="M0 -22 C -10 -26, -18 -30, -22 -38 M0 4 C -12 0, -22 -4, -26 -12 M0 26 C -9 24, -16 22, -20 16" stroke="#338050" stroke-width="5" stroke-linecap="round" fill="none"/>
      </g>
      <g stroke="#f0fadc" stroke-width="9" stroke-linecap="round" opacity="0.5">
        <path d="M192 312 L 300 312"/>
        <path d="M192 342 L 268 342"/>
      </g>
    </g>
    <g transform="rotate(40 300 260)" filter="url(#soft)">
      <rect x="284" y="86" width="38" height="280" rx="19" fill="url(#pen)"/>
      <rect x="284" y="300" width="38" height="32" fill="#3f8a57"/>
      <path d="M284 360 L322 360 L303 408 Z" fill="#e7b84a"/>
      <path d="M303 386 L303 408" stroke="#1c1917" stroke-width="6" stroke-linecap="round"/>
      <rect x="295" y="74" width="16" height="58" rx="8" fill="#3f8a57"/>
      <circle cx="303" cy="86" r="21" fill="url(#pen)"/>
    </g>
